<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento de Gasolina - STM32</title>
</head>
<body>
    <h2>Monitoramento em Tempo Real</h2>
    <h3>Média ADC: <span id="valorADC">Aguardando...</span></h3>
    <h3>Quantidade de Combustível: <span id="litros">0</span> L</h3>
    <h3>Status: <span id="status">Aguardando dados...</span></h3>

    <script>
        async function buscarDadosDoServidor() {
            try {
                // Consulta a rota do backend que guarda o último dado vindo do C#
                const response = await fetch('http://localhost:5000/dados'); 
                
                if (response.ok) {
                    const dados = await response.json();
                    
                    // Atualiza os elementos na tela
                    document.getElementById('valorADC').innerText = dados.media_recebida || "0";
                    document.getElementById('litros').innerText = dados.litros || "0";
                    document.getElementById('status').innerText = dados.status || "Sem sinal";
                }
            } catch (err) {
                console.error("Erro ao buscar dados do servidor:", err);
            }
        }

        // Executa a busca a cada 1000 milissegundos (1 segundo)
        setInterval(buscarDadosDoServidor, 1000);
    </script>
</body>
</html>
