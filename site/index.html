<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento do Tanque de Gasolina</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-center fw-bold text-white"><i class="bi bi-speedometer2 text-info me-2"></i>Monitor de Nível de Combustível</h2>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card p-3 text-center">
                <h5 class="text-muted"><i class="bi bi-cpu me-1"></i>Valor ADC</h5>
                <h1 id="valor-atual" class="display-4 fw-bold text-info">--</h1>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 text-center d-flex flex-column justify-content-center align-items-center">
                <h5 class="text-muted"><i class="bi bi-robot me-1"></i>Status do Tanque</h5>
                <div class="mt-2">
                    <span id="badge-status" class="badge status-badge">Aguardando...</span>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 text-center">
                <h5 class="text-muted"><i class="bi bi-clock-history me-1"></i>Última Atualização</h5>
                <h3 id="hora-atualizacao" class="text-white fw-bold">--:--:--</h3>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-12">
            <div class="card p-4">
                <h5 class="card-title mb-3"><i class="bi bi-database-fill-down text-info me-2"></i>Histórico de Medições</h5>
                <div class="table-responsive">
                    <table class="table table-custom m-0">
                        <thead>
                            <tr>
                                <th>Horário</th>
                                <th>Valor ADC</th>
                                <th>Status do Tanque</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-historico">
                          
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<div style="position: fixed; bottom: 25px; right: 25px; z-index: 10000; background: rgba(4, 7, 4, 0.98); border: 2px solid #ff3333; padding: 15px; border-radius: 2px; box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);">
    <h6 style="color: #ffffff; font-family: 'Share Tech Mono', monospace; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">
        <i class="bi bi-cpu-fill me-2" style="color: #ff3333;"></i>Simulador STM32
    </h6>
    <button onclick="ajustarTanque(300)" style="background: transparent; border: 1px solid #ffffff; color: #ffffff; padding: 6px 12px; font-family: 'Share Tech Mono', monospace; cursor: pointer; margin-right: 8px; font-weight: bold;">
        [ + ] AUMENTAR
    </button>
    <button onclick="ajustarTanque(-300)" style="background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 6px 12px; font-family: 'Share Tech Mono', monospace; cursor: pointer; font-weight: bold;">
        [ - ] ABAIXAR
    </button>
    <div id="debug-simulador" style="color: #ffffff; font-size: 0.75rem; margin-top: 10px; font-family: 'Share Tech Mono', monospace; opacity: 0.8;">
        Valor ADC Interno: 2000
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
